version: '3.8'

services:
  hypertrader:
    build: .
    container_name: hypertrader-bot
    restart: unless-stopped
    environment:
      # ── Anthropic Claude ──────────────────────────
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # ── Hyperliquid ───────────────────────────────
      - HL_WALLET_ADDRESS=${HL_WALLET_ADDRESS}
      - HL_PRIVATE_KEY=${HL_PRIVATE_KEY}

      # ── Telegram ─────────────────────────────────
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS}

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    command: python main.py auto
